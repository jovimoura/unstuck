app = 'unstuck-api'
primary_region = 'gru'

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = true   # para desligar quando não estiver em uso
  auto_start_machines = true  # para ligar automaticamente quando alguém acessar
  min_machines_running = 0    # IMPORTANTE! não mantenha sempre uma máquina ligada
  processes = ['app']

[env]
  OPENAI_API_KEY = "your_openai_key_here"

[[vm]]
  memory = '256mb'   # use o mínimo possível
  cpu_kind = 'shared'
  cpus = 1
